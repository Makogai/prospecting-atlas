server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify's health check target. Must not be rewritten to index.html.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/html application/xml;

  # Vite fingerprints these filenames, so they can never go stale.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sprites are content-stable but not fingerprinted: cache hard, revalidate daily.
  location /sprites/ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Every route is prerendered to <route>/index.html, so `$uri/` serves the real
  # page. Anything left over genuinely does not exist and gets a 404 status —
  # not the home page with a 200, which is a soft 404 and tells a crawler the
  # page is fine. 404.html still carries the app bundle, so a visitor who lands
  # there still sees the right thing rendered client-side.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # The HTML shells must always be revalidated, or a deploy won't be picked up.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Crawler files change every build.
  location ~* ^/(sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
