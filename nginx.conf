server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify's health check target. Must not be rewritten to index.html.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Vite fingerprints these filenames, so they can never go stale.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sprites are content-stable but not fingerprinted: cache hard, revalidate daily.
  location /sprites/ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback: every other path is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell itself must always be revalidated, or a deploy won't be picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
